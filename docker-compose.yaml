version: '3.8'

services:
  # 1. Mesin Pemroses PDF (FastAPI)
  pdf-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: damarpdf-engine
    restart: always
    environment:
      - PYTHONUNBUFFERED=1

  # 2. Reverse Proxy Nginx (Akses Port 80)
  reverse-proxy:
    image: nginx:alpine
    container_name: damarpdf-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - pdf-app
    restart: always

  # 3. GUI Management (Portainer)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: damarpdf-gui
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always

volumes:
  portainer_data: